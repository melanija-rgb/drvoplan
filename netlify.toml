[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

[[redirects]]
  from = "/api/upit"
  to = "/.netlify/functions/submit-inquiry"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/prijava"
  to = "/.netlify/functions/admin-login"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/odjava"
  to = "/.netlify/functions/admin-logout"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/upiti"
  to = "/.netlify/functions/admin-inquiries"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/upiti/*"
  to = "/.netlify/functions/admin-inquiries/:splat"
  status = 200
  force = true

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
